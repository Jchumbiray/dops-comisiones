# Jenkins local para el CI/CD. Variables en el archivo .env (no se versiona).
services:
  jenkins:
    build: ./jenkins
    container_name: jenkins-comisiones
    ports: ["8090:8080"]
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REPO_URL: ${REPO_URL}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${LOCAL_REPO_MOUNT:-./.empty}:/repo:ro
volumes:
  jenkins_home:
